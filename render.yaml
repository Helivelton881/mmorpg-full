services:
  - type: web
    name: mmorpg-2d-v022-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_GATEWAY_URL
        value: https://depdbddsbszhyeiuxhtd.supabase.co/functions/v1/game-db-gateway
      - key: DB_GATEWAY_SECRET
        sync: false
      - key: DB_SSL
        value: "true"

  - type: static
    name: mmorpg-2d-v022-web
    buildCommand: npm install && npm run build:client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://mmorpg-2d-v022-server.onrender.com
